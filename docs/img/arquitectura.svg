<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Gessler Track — Arquitectura en tres capas</text>

  <!-- Actores -->
  <g font-size="14" fill="#1f2937">
    <rect x="60" y="62" width="250" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="185" y="89" text-anchor="middle">Gestor · Desarrollador</text>
    <rect x="650" y="62" width="250" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="775" y="89" text-anchor="middle">Cliente (enlace de solo lectura)</text>
  </g>
  <line x1="185" y1="106" x2="300" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="775" y1="106" x2="660" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#fl)"/>

  <!-- Presentación -->
  <rect x="40" y="142" width="880" height="130" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="60" y="170" font-size="16" font-weight="700" fill="#1e3a8a">1. Capa de presentación</text>
  <text x="900" y="170" text-anchor="end" font-size="13" fill="#1e3a8a" font-family="Consolas, monospace">index.html · src/presentacion/</text>
  <g font-size="13" fill="#1f2937">
    <rect x="60" y="186" width="200" height="66" rx="8" fill="#fff" stroke="#93c5fd"/><text x="160" y="214" text-anchor="middle" font-weight="600">Tablero del equipo</text><text x="160" y="234" text-anchor="middle" fill="#475569">KPIs, filtros, listado</text>
    <rect x="275" y="186" width="200" height="66" rx="8" fill="#fff" stroke="#93c5fd"/><text x="375" y="214" text-anchor="middle" font-weight="600">Detalle de proyecto</text><text x="375" y="234" text-anchor="middle" fill="#475569">estado, pagos, bitácora</text>
    <rect x="490" y="186" width="200" height="66" rx="8" fill="#fff" stroke="#93c5fd"/><text x="590" y="214" text-anchor="middle" font-weight="600">Nuevo proyecto</text><text x="590" y="234" text-anchor="middle" fill="#475569">formulario + mensajes</text>
    <rect x="705" y="186" width="195" height="66" rx="8" fill="#fff" stroke="#93c5fd"/><text x="802" y="214" text-anchor="middle" font-weight="600">Vista cliente</text><text x="802" y="234" text-anchor="middle" fill="#475569">solo lectura</text>
  </g>

  <line x1="480" y1="272" x2="480" y2="306" stroke="#475569" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="492" y="294" font-size="12" fill="#475569">llama a GT.logica</text>

  <!-- Lógica -->
  <rect x="40" y="308" width="880" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="60" y="336" font-size="16" font-weight="700" fill="#14532d">2. Capa de lógica de negocio</text>
  <text x="900" y="336" text-anchor="end" font-size="13" fill="#14532d" font-family="Consolas, monospace">src/logica/reglas.js</text>
  <g font-size="13" fill="#1f2937">
    <rect x="60" y="352" width="200" height="66" rx="8" fill="#fff" stroke="#86efac"/><text x="160" y="380" text-anchor="middle" font-weight="600">Proyectos y estados</text><text x="160" y="400" text-anchor="middle" fill="#475569">crear, cambiar estado</text>
    <rect x="275" y="352" width="200" height="66" rx="8" fill="#fff" stroke="#86efac"/><text x="375" y="380" text-anchor="middle" font-weight="600">Pagos y entregas</text><text x="375" y="400" text-anchor="middle" fill="#475569">saldo, vencimientos, KPIs</text>
    <rect x="490" y="352" width="200" height="66" rx="8" fill="#fff" stroke="#86efac"/><text x="590" y="380" text-anchor="middle" font-weight="600">Validaciones</text><text x="590" y="400" text-anchor="middle" fill="#475569">proyecto, pago, escape</text>
    <rect x="705" y="352" width="195" height="66" rx="8" fill="#fff" stroke="#86efac"/><text x="802" y="380" text-anchor="middle" font-weight="600">Permisos por rol</text><text x="802" y="400" text-anchor="middle" fill="#475569">gestor, desarrollador, cliente</text>
  </g>

  <line x1="480" y1="438" x2="480" y2="472" stroke="#475569" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="492" y="460" font-size="12" fill="#475569">cargar / guardar</text>

  <!-- Persistencia -->
  <rect x="40" y="474" width="880" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="60" y="502" font-size="16" font-weight="700" fill="#78350f">3. Capa de persistencia</text>
  <text x="900" y="502" text-anchor="end" font-size="13" fill="#78350f" font-family="Consolas, monospace">src/persistencia/repositorio.js</text>
  <g font-size="13" fill="#1f2937">
    <rect x="60" y="514" width="410" height="44" rx="8" fill="#fff" stroke="#fcd34d"/><text x="265" y="541" text-anchor="middle"><tspan font-weight="600">Actual:</tspan> localStorage del navegador</text>
    <rect x="490" y="514" width="410" height="44" rx="8" fill="#fff" stroke="#fcd34d" stroke-dasharray="6 4"/><text x="695" y="541" text-anchor="middle" fill="#475569"><tspan font-weight="600" fill="#1f2937">Siguiente fase:</tspan> base de datos relacional</text>
  </g>
</svg>
